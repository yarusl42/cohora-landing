name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate landing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: |
          npm run format:check
          npm run lint
          npm run build

  build-image:
    name: Build and publish landing image
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    outputs:
      landing-image: ${{ steps.meta.outputs.landing-image }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Prepare image name
        id: meta
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}/landing:${GITHUB_SHA}"
          echo "landing-image=$IMAGE" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish landing
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.landing-image }}
          build-args: |
            NEXT_PUBLIC_MIXPANEL_TOKEN=${{ vars.NEXT_PUBLIC_MIXPANEL_TOKEN }}
            NEXT_PUBLIC_SENTRY_DSN=${{ vars.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID=${{ vars.NEXT_PUBLIC_GOOGLE_TAG_MANAGER_ID }}
          cache-from: type=gha,scope=landing
          cache-to: type=gha,mode=max,scope=landing

  deploy:
    name: Deploy landing to production
    needs: build-image
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: false

    steps:
      - name: Check out deployment configuration
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$HOST_KEY" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Synchronize landing deployment configuration
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes deploy/docker-compose.yml "$USER@$HOST:/opt/cohora/landing-compose.yml"

      - name: Pull and start the landing release
        env:
          HOST: ${{ secrets.VPS_HOST }}
          USER: ${{ secrets.VPS_USER }}
          LANDING_IMAGE: ${{ needs.build-image.outputs.landing-image }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes "$USER@$HOST" "cd /opt/cohora && LANDING_IMAGE='$LANDING_IMAGE' docker compose --env-file .env -f docker-compose.yml -f landing-compose.yml pull landing && LANDING_IMAGE='$LANDING_IMAGE' docker compose --env-file .env -f docker-compose.yml -f landing-compose.yml up -d landing"
