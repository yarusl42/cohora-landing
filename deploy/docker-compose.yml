name: cohora

services:
  landing:
    image: ${LANDING_IMAGE:?Set LANDING_IMAGE to the immutable GHCR landing image tag}
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
